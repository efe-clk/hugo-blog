server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml
               application/javascript application/json image/svg+xml;

    # Fingerprinted assets and media: long cache
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML / XML: always revalidate so new posts show up immediately
    location ~* \.(?:html|xml|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
